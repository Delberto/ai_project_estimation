[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.7.0",
    "litellm>=1.60.0",
    "jinja2>=3.1.6",
    "fastapi>=0.136.3",
    "numpy",
    "openai>=2.40.0",
    "orjson>=3.10.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "streamlit",
    "structlog",
    "uvicorn[standard]>=0.48.0",
    "anthropic",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["app/prompts", "app/services", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"